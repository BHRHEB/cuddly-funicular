<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pornhub Proxy</title>
  <style>
    body { font-family: Arial; background: #000; color: #fff; text-align: center; padding: 50px; }
    input, button { padding: 12px; margin: 10px; font-size: 16px; }
    button { background: #ff0000; color: white; border: none; cursor: pointer; }
    #result { margin-top: 20px; text-align: left; max-width: 800px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <h1>Pornhub Proxy (Vercel)</h1>
  
  <input type="text" id="search" placeholder="Search Pornhub..." style="width: 400px;">
  <button onclick="searchPornhub()">Search</button>

  <div id="result"></div>

  <script>
    async function searchPornhub() {
      const query = document.getElementById('search').value;
      if (!query) return alert("Search something...");

      const res = await fetch(`/api/proxy?url=https://www.pornhub.com/video/search?search=${encodeURIComponent(query)}`);
      const html = await res.text();
      
      document.getElementById('result').innerHTML = `
        <h2>Results for: ${query}</h2>
        <pre>${html.substring(0, 1000)}...</pre>
        <p><strong>Full HTML fetched via Vercel Proxy</strong></p>
      `;
    }
  </script>
</body>
</html>
